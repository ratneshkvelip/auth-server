spring.application.name=finance-auth-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:ratneshvelip}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.default_schema=finance

server.port=${SERVER_PORT:8088}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true

spring.jpa.open-in-view=false

management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health,info


logging.level.org.springframework.boot.actuate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

security.jwt.issuer=${JWT_ISSUER:finance-auth-service}
security.jwt.access-token-seconds=${JWT_ACCESS_TOKEN_SECONDS:900}
security.jwt.private-key-base64=${JWT_PRIVATE_KEY_BASE64:}
security.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}

